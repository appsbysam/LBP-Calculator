<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5d3b"><meta name="description" content="Quick USD/LBP change calculator using a fixed rate of 1 USD = 90,000 LBP."><title>LBP Change Calculator</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="hero"><div class="brand-row"><img class="app-logo" src="assets/icon-192.png" alt=""><div><h1>LBP Change Calculator</h1><p>USD ↔ Lebanese Pound change converter</p></div><span class="version">v1.0</span></div><div class="rate">Fixed rate: <strong>US$1 = LBP 90,000</strong></div></header><section class="tabs"><button class="tab active" data-tab="change">Calculate Change</button><button class="tab" data-tab="reverse">Reverse Calculate</button></section><section id="change" class="panel active"><div class="card"><label><span>Purchase amount (USD)</span><div class="money-input"><b>$</b><input id="purchase" type="number" inputmode="decimal" step="0.01" min="0" value="72"></div></label><label><span>Amount paid (USD)</span><div class="money-input"><b>$</b><input id="paid" type="number" inputmode="decimal" step="0.01" min="0" value="100"></div></label><div class="field-label">USD change to receive</div><div class="quick-row"><button class="quick" data-usd="20">$20</button><button class="quick selected" data-usd="25">$25</button><button class="quick" data-usd="30">$30</button><button class="quick" id="autoUsd">Auto $5</button></div><label><span>Or enter USD change manually</span><div class="money-input"><b>$</b><input id="usdPart" type="number" inputmode="decimal" step="1" min="0" value="25"></div></label><button id="calcBtn" class="primary">Calculate Change</button></div><div class="result-card"><div class="result-title">Your Change</div><div class="big-total" id="totalChange">$28.00 total</div><div class="breakdown"><div><span>USD change</span><strong id="usdResult">$25.00</strong></div><div><span>LBP change</span><strong id="lbpResult">LBP 270,000</strong></div></div><p class="explain" id="explain"></p></div></section><section id="reverse" class="panel"><div class="card"><label><span>USD change received</span><div class="money-input"><b>$</b><input id="reverseUsd" type="number" inputmode="decimal" step="0.01" min="0" value="25"></div></label><label><span>LBP change received</span><div class="money-input"><b>LBP</b><input id="reverseLbp" type="number" inputmode="numeric" step="1000" min="0" value="270000"></div></label><button id="reverseBtn" class="primary">Calculate Total</button></div><div class="result-card"><div class="result-title">Total Change Equivalent</div><div class="big-total" id="reverseTotal">$28.00</div><div class="breakdown"><div><span>USD part</span><strong id="reverseUsdOut">$25.00</strong></div><div><span>LBP part in USD</span><strong id="reverseLbpOut">$3.00</strong></div></div><p class="explain" id="reverseExplain"></p></div></section><footer><span>Designed for everyday cash change in Lebanon.</span><button id="installBtn" class="install" hidden>Install App</button></footer></main><script src="app.js"></script></body></html>
